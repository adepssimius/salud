<main class="app-shell" [class.shell-authed]="isAuthed()">
  <header class="app-header">
    <div class="brand">Salud</div>
    <nav class="nav-actions">
      <ng-container *ngIf="isAuthed(); else loggedOut">
        <!-- No link list here any more: navigation lives in the bottom bar (mobile) and the left
             rail (desktop). A top-right link row is a desktop pattern on the device this product
             is primarily for (frontend.md → "Information architecture (v2)" → App shell).
             The menu is a sibling of the toggle, not a child: a <button> may not contain the
             menu's own link and button. -->
        <div class="profile-wrap">
          <button
            type="button"
            class="profile"
            data-testid="profile-toggle"
            aria-haspopup="menu"
            aria-label="Account menu"
            [attr.aria-expanded]="menuOpen()"
            (click)="$event.stopPropagation(); toggleMenu()"
          >
            <span class="avatar">👤</span>
          </button>
          <div class="menu" role="menu" *ngIf="menuOpen()">
            <a routerLink="/profile" role="menuitem" (click)="closeMenu()">Edit profile</a>
            <!-- Manage: monthly setup tasks. They reach the menu on mobile and the rail bottom on
                 desktop, so they stop competing with "log a dose" for the most urgent screen. -->
            <span class="menu-label">Manage</span>
            <a
              *ngFor="let item of manageItems"
              [routerLink]="item.path"
              role="menuitem"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
            <button type="button" role="menuitem" (click)="logout()">Log out</button>
          </div>
        </div>
      </ng-container>
      <ng-template #loggedOut>
        <a *ngIf="!isLoginRoute()" routerLink="/login">Sign In</a>
        <a *ngIf="!isRegisterRoute()" routerLink="/register">Sign Up</a>
      </ng-template>
    </nav>
  </header>

  <div class="app-body">
    <!-- Desktop only (CSS): the patient list stays visible, Home at the top, Manage at the bottom. -->
    <nav class="side-rail" *ngIf="isAuthed()" aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active" class="rail-link">Home</a>
      <button type="button" class="primary rail-add" (click)="openQuickLog()">＋ Quick log</button>

      <div class="rail-section">
        <span class="rail-label">Patients</span>
        <a
          *ngFor="let p of patients()"
          [routerLink]="['/patients', p.id]"
          routerLinkActive="active"
          class="rail-link"
          >{{ p.fullName }}</a
        >
        <a routerLink="/patients" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="rail-link rail-muted"
          >All patients</a
        >
      </div>

      <div class="rail-section rail-bottom">
        <span class="rail-label">Manage</span>
        <a *ngFor="let item of manageItems" [routerLink]="item.path" routerLinkActive="active" class="rail-link">{{
          item.label
        }}</a>
      </div>
    </nav>

    <section class="app-content">
      <router-outlet></router-outlet>
    </section>
  </div>

  <!-- Mobile only (CSS). Three slots, all thumb-reachable, the `+` in the centre. -->
  <nav class="bottom-bar" *ngIf="isAuthed()" aria-label="Primary">
    <a routerLink="/dashboard" routerLinkActive="active" class="bottom-link">
      <span class="bottom-icon" aria-hidden="true">🏠</span>
      <span>Home</span>
    </a>
    <button
      type="button"
      class="bottom-add"
      data-testid="quick-log-open"
      aria-label="Quick log"
      (click)="openQuickLog()"
    >
      ＋
    </button>
    <a routerLink="/patients" routerLinkActive="active" class="bottom-link">
      <span class="bottom-icon" aria-hidden="true">👥</span>
      <span>Patients</span>
    </a>
  </nav>

  <!-- Deferred so the sheet and its dependencies stay out of the initial bundle; the *ngIf is what
       tears it down again, since a `when` trigger never reverts on its own. -->
  @defer (when quickLogOpen()) {
    <app-quick-log-sheet
      *ngIf="quickLogOpen()"
      [lockedPatientId]="hubPatientId()"
      (dismiss)="closeQuickLog()"
    ></app-quick-log-sheet>
  }
</main>
