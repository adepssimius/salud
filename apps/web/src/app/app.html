<main class="app-shell">
  <header class="app-header">
    <div class="brand">Salud</div>
    <nav class="nav-actions">
      <ng-container *ngIf="isAuthed(); else loggedOut">
        <a routerLink="/dashboard">Dashboard</a>
        <!-- The menu is a sibling of the toggle, not a child: a <button> may not contain the
             menu's own link and button. -->
        <div class="profile-wrap">
          <button
            type="button"
            class="profile"
            data-testid="profile-toggle"
            aria-haspopup="menu"
            aria-label="Account menu"
            [attr.aria-expanded]="menuOpen()"
            (click)="$event.stopPropagation(); toggleMenu()"
          >
            <span class="avatar">👤</span>
          </button>
          <div class="menu" role="menu" *ngIf="menuOpen()">
            <a routerLink="/profile" role="menuitem" (click)="closeMenu()">Edit profile</a>
            <button type="button" role="menuitem" (click)="logout()">Log out</button>
          </div>
        </div>
      </ng-container>
      <ng-template #loggedOut>
        <a *ngIf="!isLoginRoute()" routerLink="/login">Sign In</a>
        <a *ngIf="!isRegisterRoute()" routerLink="/register">Sign Up</a>
      </ng-template>
    </nav>
  </header>
  <section class="app-content">
    <router-outlet></router-outlet>
  </section>
</main>
