server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Document-level security headers. These belong here rather than on the API because only the
  # layer that serves the document can author its policy (deployment.md → Security headers). The
  # API sets its own, much stricter, CSP in app.security.ts.
  #
  # `always` so they are emitted on error responses too, not just 2xx.
  add_header X-Content-Type-Options  "nosniff"                          always;
  add_header X-Frame-Options         "DENY"                             always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

  # Three parts of this policy are load-bearing and shouldn't be "tightened" without reading why:
  #
  #  - `style-src 'unsafe-inline'` is REQUIRED, not laziness. Every page in this app declares an
  #    inline `styles:` array (CLAUDE.md → Conventions) and Angular injects them as runtime <style>
  #    elements. Removing it needs CSP_NONCE with a per-request nonce in index.html, which static
  #    nginx cannot do. Documenting the trade-off beats shipping a policy that breaks every page.
  #  - `script-src 'self'` with NO 'unsafe-inline' works against the current production build: two
  #    plain module <script src> tags and no inlined critical CSS. If a future Angular/beasties
  #    version starts inlining it with onload=, set optimization.styles.inlineCritical=false in
  #    apps/web/project.json rather than loosening this.
  #  - `img-src blob:` is required by core/photo-thumbnail.component.ts, which renders photos via
  #    URL.createObjectURL. That thumbnail also links to the blob: URL in a new tab, and a blob:
  #    document inherits this origin *and this policy* — which is what stops a malicious uploaded
  #    SVG from executing when a caregiver clicks it.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
