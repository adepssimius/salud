# Cache policy, expressed as a map so there is exactly ONE `add_header Cache-Control`, at server
# level, next to the security headers below.
#
# That is not a style preference. nginx inherits `add_header` from an outer block ONLY when the
# inner block declares none of its own — so dropping a Cache-Control add_header into a `location`
# would silently discard every security header above it for exactly those responses, including the
# CSP on index.html, the one document that most needs it. Keeping all add_header directives at a
# single level makes that class of mistake impossible.
#
# `map` is valid here because the Dockerfile installs this file as conf.d/default.conf, which the
# stock nginx.conf includes inside `http {}`.
map $uri $salud_cache_control {
  # index.html is the only file whose name never changes between builds, so a browser that caches
  # it keeps loading whatever bundle hashes it referenced at the time — the app pins itself to an
  # old version with no request reaching the cluster to explain it. That is not hypothetical: it
  # is how a caregiver ended up staring at a password form after OIDC went live, being told
  # "unable to sign in" by a bundle that predated the message explaining why.
  #
  # `no-cache` does not prevent caching, it forces revalidation — the browser still keeps the copy
  # and still gets a cheap 304 when nothing changed.
  #
  # Deep links (/patients/<id>) reach here as index.html too: try_files rewrites $uri on the
  # internal redirect, so they land on this default rather than the immutable rule below.
  default  "no-cache";

  # Angular emits content-hashed filenames (main-2N5A5CP3.js, styles-OLD5FDBE.css). A new build is
  # a new name, so these can never go stale and are safe to cache indefinitely. Unhashed files in
  # public/ — favicon.ico and friends — deliberately fall through to the default: they keep their
  # names forever, so they must revalidate.
  "~^/[^/]+-[A-Z0-9]{8,}\.(?:js|css)$"  "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Document-level security headers. These belong here rather than on the API because only the
  # layer that serves the document can author its policy (deployment.md → Security headers). The
  # API sets its own, much stricter, CSP in app.security.ts.
  #
  # `always` so they are emitted on error responses too, not just 2xx.
  add_header X-Content-Type-Options  "nosniff"                          always;
  add_header X-Frame-Options         "DENY"                             always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

  # Three parts of this policy are load-bearing and shouldn't be "tightened" without reading why:
  #
  #  - `style-src 'unsafe-inline'` is REQUIRED, not laziness. Every page in this app declares an
  #    inline `styles:` array (CLAUDE.md → Conventions) and Angular injects them as runtime <style>
  #    elements. Removing it needs CSP_NONCE with a per-request nonce in index.html, which static
  #    nginx cannot do. Documenting the trade-off beats shipping a policy that breaks every page.
  #  - `script-src 'self'` with NO 'unsafe-inline' holds only because the production build emits two
  #    plain module <script src> tags and no inlined critical CSS. That second half is NOT the
  #    Angular default: optimization.styles.inlineCritical is explicitly false in
  #    apps/web/project.json. Left at its default (true), beasties inlines the critical CSS and
  #    rewrites the stylesheet link to media="print" onload="this.media='all'" — this CSP blocks
  #    that inline handler, the link never flips to media="all", and the entire stylesheet silently
  #    stops applying. Every page renders unstyled. Re-enable it and you ship that bug; loosening
  #    script-src to work around it is the wrong trade.
  #  - `img-src blob:` is required by core/photo-thumbnail.component.ts, which renders photos via
  #    URL.createObjectURL. That thumbnail also links to the blob: URL in a new tab, and a blob:
  #    document inherits this origin *and this policy* — which is what stops a malicious uploaded
  #    SVG from executing when a caregiver clicks it.
  # Paired with the map at the top of this file. `always` for the same reason as the headers above:
  # a 304 from a revalidating browser is not a 2xx, and it still needs to carry the policy.
  add_header Cache-Control $salud_cache_control always;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
