name: Setup workspace
description: >-
  Node + an installed node_modules, shared by every CI job. Restores node_modules itself rather
  than leaning on setup-node's `cache: yarn`: that only caches yarn's global download cache, so
  every job still paid a full `yarn install` on top of the restore (32s + 36s in run 36). Keyed on
  the lockfile plus the runner OS and the Node version, because better-sqlite3 and argon2 leave
  compiled .node binaries in the tree that are not portable across either.

inputs:
  cache-key-suffix:
    description: >-
      Distinguishes this job's Nx cache from a sibling's. Needed for matrix legs, which all share
      one `github.job` and would otherwise race to save the same key.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22.13.0

    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node22.13.0-${{ hashFiles('yarn.lock') }}

    # Only on a lockfile change. Every job in a run shares one key, so on a cold cache they all
    # miss and all try to save it; the losers log a warning and carry on, which is harmless.
    - if: steps.modules.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile
      shell: bash

    # Nx's local cache, carried between runs. The payoff is the merge to `main`: that commit has
    # the same tree as the PR head CI just went green on, so every lint/build/test task is a hash
    # hit and the deploy run does nothing but publish. Scoped per job because the jobs below run
    # in parallel and would otherwise race to save the same key.
    - uses: actions/cache@v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.job }}${{ inputs.cache-key-suffix }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ github.job }}${{ inputs.cache-key-suffix }}-
