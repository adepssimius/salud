name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '20*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn nx run-many -t lint,test,build

      # SQLite is a fully supported deployment target (self-hosting), not just a dev fallback —
      # app-spec/persistence.md. The `test` target above already ran the api suite once, but on
      # Postgres (TEST_DB defaults to pglite — real Postgres in WASM, see
      # apps/api/src/testing/create-test-app.ts); a green run there says nothing about the SQLite
      # build a self-hoster actually gets, so run the same suite again on that leg. Scoped to the
      # api project alone — lint/build/web don't vary by TEST_DB, so there's nothing to re-run.
      - name: Test api (SQLite)
        run: yarn test:api --skip-nx-cache
        env:
          TEST_DB: sqlite

  publish:
    needs: test
    # Every push to main publishes, not just tags — Flux's image automation watches these and
    # commits the bump to k8s-infra, so merging to main is the deploy. Pull requests never publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main builds get `main-<run number>-<short sha>`; explicit tags keep publishing under the
      # tag verbatim.
      #
      # The run number rather than a timestamp is deliberate on both counts: it is identical
      # across every job in this matrix, so api and web can never drift onto different tags the
      # way two independently-computed timestamps could; and it is monotonic, so Flux's
      # ImagePolicy can sort it numerically without depending on fixed-width formatting. Flux
      # only matches the `main-` form, so cutting a tag pins a release without deploying it.
      - name: Compute image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${{ github.run_number }}-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/adepssimius/salud-${{ matrix.image }}:${{ steps.tag.outputs.value }}
          # Without this each publish recompiles the whole workspace once per matrix image.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
