name: CI

# Docs-only changes (markdown anywhere, anything under app-spec/) skip the pipeline: they can't
# change test results, and skipping the publish job on a docs-only push to main means no new image
# and no Flux-triggered redeploy for a change that is invisible to the running app. Safe because
# `main` has no required status checks (a path-ignored required check would strand PRs on
# "Expected"). Note GitHub does not evaluate path filters for tag pushes, so `20*` release tags
# always publish regardless of what the tagged commit touched.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'app-spec/**'
  push:
    branches:
      - main
    tags:
      - '20*'
    paths-ignore:
      - '**/*.md'
      - 'app-spec/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: yarn

      - run: yarn install --frozen-lockfile

      # `test` deliberately excluded here — the api and web suites need different NODE_OPTIONS
      # (see below) and run as their own steps instead.
      - run: yarn nx run-many -t lint,build

      - name: Test web
        run: yarn test:web

      # NODE_OPTIONS is required for the api suite's default TEST_DB=pglite leg — @electric-sql/pglite
      # loads part of itself via a dynamic import() at runtime, which Node's Jest-managed worker
      # processes refuse without this flag (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING_FLAG). It has to
      # be scoped to just the api steps: applied job-wide, it changes Jest's module-loading path
      # for jest-preset-angular's .mjs setup file too and breaks every web test with "Must use
      # import to load ES Module" — found by CI actually going red on exactly that, not in review.
      - name: Test api (Postgres)
        run: yarn test:api --skip-nx-cache

      # SQLite is a fully supported deployment target (self-hosting), not just a dev fallback —
      # app-spec/persistence.md. The step above already ran the api suite once, but on Postgres
      # (TEST_DB defaults to pglite — real Postgres in WASM, see
      # apps/api/src/testing/create-test-app.ts); a green run there says nothing about the SQLite
      # build a self-hoster actually gets, so run the same suite again on that leg.
      - name: Test api (SQLite)
        run: yarn test:api --skip-nx-cache
        env:
          TEST_DB: sqlite

  publish:
    needs: test
    # Every push to main publishes, not just tags — Flux's image automation watches these and
    # commits the bump to k8s-infra, so merging to main is the deploy. Pull requests never publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main builds get `main-<run number>-<short sha>`; explicit tags keep publishing under the
      # tag verbatim.
      #
      # The run number rather than a timestamp is deliberate on both counts: it is identical
      # across every job in this matrix, so api and web can never drift onto different tags the
      # way two independently-computed timestamps could; and it is monotonic, so Flux's
      # ImagePolicy can sort it numerically without depending on fixed-width formatting. Flux
      # only matches the `main-` form, so cutting a tag pins a release without deploying it.
      - name: Compute image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${{ github.run_number }}-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/adepssimius/salud-${{ matrix.image }}:${{ steps.tag.outputs.value }}
          # Without this each publish recompiles the whole workspace once per matrix image.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
